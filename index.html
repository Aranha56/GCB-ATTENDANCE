<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>GCB Estonia — Training Attendance</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/GCB.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="authOverlay" class="overlay hidden" aria-live="polite">
    <div class="auth-card">
      <div class="brand brand-auth">
        <div class="gcb-logo" aria-label="GCB Estonia">
          <img src="assets/GCB.png" alt="GCB Estonia" />
        </div>
        <div class="brand-copy"><div class="brand-title">TRAINING ATTENDANCE</div><div class="brand-sub">PEOPLE · DISCIPLINE · COMMUNITY</div></div>
      </div>
      <h2>Вход в GCB Attendance</h2>
      <p class="muted">Один аккаунт — одна база данных на телефоне и компьютере.</p>
      <label class="form-label">Email<input id="authEmail" class="text-input" type="email" autocomplete="email" placeholder="you@example.com" /></label>
      <label class="form-label">Пароль<input id="authPassword" class="text-input" type="password" autocomplete="current-password" placeholder="Минимум 6 символов" /></label>
      <div class="auth-actions"><button id="signInBtn" class="btn primary">Войти</button><button id="signUpBtn" class="btn secondary">Создать аккаунт</button></div>
      <button id="continueLocalBtn" class="btn ghost full">Продолжить локально</button>
      <div id="authMsg" class="form-msg"></div>
    </div>
  </div>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="gcb-logo" aria-label="GCB Estonia">
          <img src="assets/GCB.png" alt="GCB Estonia" />
        </div>
        <div class="brand-copy"><div class="brand-title">TRAINING ATTENDANCE</div><div class="brand-sub">PEOPLE · DISCIPLINE · COMMUNITY</div></div>
      </div>
      <div id="syncBadge" class="sync-badge local"><span class="sync-dot"></span><span>Локально</span></div>
    </header>

    <section id="view" class="view"></section>

    <nav class="bottom-nav" aria-label="Навигация">
      <button data-nav="attendance" class="nav-item active"><span class="nav-icon">⌂</span><small>Главная</small></button>
      <button data-nav="groups" class="nav-item"><span class="nav-icon">♟</span><small>Группы</small></button>
      <button data-nav="children" class="nav-item"><span class="nav-icon">♙</span><small>Дети</small></button>
      <button data-nav="more" class="nav-item"><span class="nav-icon">•••</span><small>Ещё</small></button>
    </nav>
  </main>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
